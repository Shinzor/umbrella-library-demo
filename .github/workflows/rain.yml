name: Save rain chance

on:
  schedule:
    - cron: '5 22 * * *' # 07:05 Asia/Seoul (UTC+9, no daylight saving)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch today's Seoul rain chance
        run: |
          curl -fsS --retry 3 -o "$RUNNER_TEMP/forecast.json" \
            'https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.978&daily=precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=1'
          jq --arg updated "$(TZ=Asia/Seoul date -Iseconds)" '{
              date: .daily.time[0],
              chance: (.daily.precipitation_probability_max[0] | if type == "number" then . else error("no forecast") end),
              updated: $updated
            }' "$RUNNER_TEMP/forecast.json" > rain.json
          cat rain.json

      - name: Ask Jev whether to put the umbrellas out
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          # No key or no answer: keep the forecast and skip the decision.
          if [ -z "$TYPESAFE_API_KEY" ]; then echo "No TYPESAFE_API_KEY secret, skipping Jev."; exit 0; fi
          jq '{
              model: "jev-latest",
              state: { city: "Seoul", date: .date, chance_of_rain_percent: .chance },
              questions: { umbrellas_out: { type: "noul", instructions: "The library should put the umbrellas out today" } }
            }' rain.json > "$RUNNER_TEMP/ask.json"
          if curl -fsS --retry 2 https://api.typesafe.ai/v1/systemone \
               -H "Authorization: Bearer $TYPESAFE_API_KEY" -H 'Content-Type: application/json' \
               --data-binary @"$RUNNER_TEMP/ask.json" -o "$RUNNER_TEMP/answer.json" \
             && noul=$(jq -e '.answers.umbrellas_out.noul | numbers' "$RUNNER_TEMP/answer.json"); then
            echo "Jev noul for umbrellas out: $noul"
            jq --argjson noul "$noul" '. + { umbrellas_out: $noul }' rain.json > "$RUNNER_TEMP/rain.json"
            mv "$RUNNER_TEMP/rain.json" rain.json
          else
            echo "Jev did not answer, keeping the forecast without a decision."
          fi
          cat rain.json

      - name: Commit rain.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rain.json
          git commit -m "Update rain.json for $(jq -r .date rain.json)"
          git push
